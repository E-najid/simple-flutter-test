name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      has_signing: ${{ steps.signing_detect.outputs.has_signing }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect signing config
        id: signing_detect
        run: |
          if [ -f signing/release.keystore.b64 ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure Environment Secrets (.env)
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Build Android APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Building APK with target: $BUILD_TYPE"
          if [ "$BUILD_TYPE" == "release" ]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK-${{ github.run_number }}
          path: |
            build/app/outputs/apk/**/*.apk
          retention-days: 90

      - name: Create GitHub Release & Attach APK (On Tag Push Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/apk/**/*.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-sign:
    name: Sign release APK
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.has_signing == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode signing keystore
        run: base64 -d signing/release.keystore.b64 > /tmp/release.keystore

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Sign release APK
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)"
          IN="$(ls build/app/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1)"
          if [ -z "$IN" ]; then IN="$(ls build/app/outputs/apk/release/*.apk | head -1)"; fi
          "$BT/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$(grep '^storePassword=' signing/signing.properties | cut -d= -f2-)" \
            --ks-key-alias "$(grep '^keyAlias=' signing/signing.properties | cut -d= -f2-)" \
            --key-pass "pass:$(grep '^keyPassword=' signing/signing.properties | cut -d= -f2-)" \
            --out app-release-signed.apk "$IN"
          "$BT/apksigner" verify --print-certs app-release-signed.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release-signed.apk
          retention-days: 90